plugins { id 'com.android.application' }

/* 서명 키는 리포에 두지 않는다. 있으면 쓰고 없으면 그 설정을 아예 안 만든다 —
   키가 없다고 빌드가 통째로 막히면 남이 이 저장소를 받아 볼 수도 없다.

   sideload : 지금까지 쓰던 키. 기존 설치본 위에 덮어쓰려면 서명이 같아야 한다.
              이 키는 예전에 리포에 통째로 올라가 이력에 남아 있으므로
              업로드 키로는 절대 쓰지 않는다.
   upload   : 플레이 스토어 업로드 전용. CI 가 Secrets 에서 꺼내 파일로 만든다.

   릴리스가 어느 쪽으로 서명될지는 '어느 키가 그 자리에 있느냐' 로 갈린다.
   APK 만드는 일감에는 업로드 키를 안 내려놓고, AAB 일감에만 내려놓는다. */
def ksSide = file(System.getenv('SIDELOAD_KEYSTORE') ?: 'keystore.p12')
def ksUp   = file(System.getenv('UPLOAD_KEYSTORE')   ?: 'upload.jks')

android {
  namespace 'com.lwd20.traininglog'
  compileSdk 36

  signingConfigs {
    if (ksSide.exists()) {
      sideload {
        storeFile ksSide
        storeType 'PKCS12'
        storePassword System.getenv('SIDELOAD_STORE_PASS') ?: 'traininglog'
        keyAlias      System.getenv('SIDELOAD_ALIAS')      ?: 'tl'
        keyPassword   System.getenv('SIDELOAD_KEY_PASS')   ?: 'traininglog'
      }
    }
    if (ksUp.exists()) {
      upload {
        storeFile ksUp
        storeType 'JKS'
        storePassword System.getenv('UPLOAD_STORE_PASS')
        keyAlias      System.getenv('UPLOAD_ALIAS') ?: 'upload'
        keyPassword   System.getenv('UPLOAD_KEY_PASS')
      }
    }
  }

  defaultConfig {
    /* 플레이 콘솔에 만들어 둔 이름과 같아야 한다. 콘솔의 패키지명은 영구라
       나중에 못 바꾸고, 지운 뒤 다시 쓸 수도 없다.
       안드로이드는 이것이 바뀌면 다른 앱으로 본다 — 예전 패키지로 깔린
       설치본은 갱신되지 않고 그 안의 기록도 따라오지 않는다. */
    applicationId 'com.lwd20.plus25'
    minSdk 24
    targetSdk 36
    versionCode 33
    versionName '2.5.0'
  }

  compileOptions { encoding = 'UTF-8' }

  buildTypes {
    debug {
      if (ksSide.exists()) signingConfig signingConfigs.sideload
    }
    release {
      minifyEnabled false
      if (ksUp.exists())        signingConfig signingConfigs.upload
      else if (ksSide.exists()) signingConfig signingConfigs.sideload
    }
  }
}
