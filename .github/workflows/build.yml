name: build

on: [push, workflow_dispatch]

# 릴리스에 APK 를 올리려면 쓰기 권한이 필요하다
permissions:
  contents: write

jobs:
  # ── 사이드로드용 APK ────────────────────────────────────────────
  # 지금까지 쓰던 키로 서명한다. 서명이 같아야 기존 설치본 위에 덮어써진다.
  # 이 일감에는 업로드 키를 아예 내려놓지 않는다 — build.gradle 이 '어느 키가
  # 그 자리에 있느냐' 로 갈리므로, 없으면 저절로 사이드로드 키를 쓴다.
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 키는 리포에 없다. Secrets 에서 꺼내 파일로 만든다.
      # 없으면 서명 없이 빌드만 하고 넘어간다 — 남이 이 저장소를 받아도 돌아야 한다.
      - name: 사이드로드 키 꺼내기
        if: ${{ secrets.SIDELOAD_KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.SIDELOAD_KEYSTORE_B64 }}" | base64 -d > app/keystore.p12

      - run: gradle assembleRelease
        env:
          SIDELOAD_STORE_PASS: ${{ secrets.SIDELOAD_STORE_PASS }}
          SIDELOAD_KEY_PASS: ${{ secrets.SIDELOAD_KEY_PASS }}
          SIDELOAD_ALIAS: ${{ secrets.SIDELOAD_ALIAS }}

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk plus25.apk

      - uses: actions/upload-artifact@v4
        with:
          name: plus25-apk
          path: plus25.apk

      - name: 최신 릴리스에 올리기
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # latest 태그 하나를 계속 덮어쓴다 — 링크가 바뀌지 않게
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "최신 빌드" --notes "자동 빌드"
          gh release edit latest \
            --title "최신 빌드 · $(date -u +%Y-%m-%d)" \
            --notes "커밋 ${GITHUB_SHA:0:7} · $(date -u +'%Y-%m-%d %H:%M') UTC
          설치: 아래 plus25.apk 를 폰에서 받아 실행."
          gh release upload latest plus25.apk --clobber

  # ── 플레이 스토어용 AAB ────────────────────────────────────────
  # 손으로 돌린다. 커밋할 때마다 스토어용을 굽지 않는다 — versionCode 를
  # 올리지 않은 채 여러 개가 나오면 어느 것이 올린 것인지 알 수 없게 된다.
  aab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 업로드 키가 없으면 여기서 멈춘다. 사이드로드 키로 서명된 AAB 를
      # 스토어에 올리면 그 키가 영원히 이 앱의 업로드 키로 굳는다 —
      # 그 키는 이미 리포 이력에 통째로 남아 있어 절대 그러면 안 된다.
      - name: 업로드 키 확인
        run: |
          if [ -z "${{ secrets.UPLOAD_KEYSTORE_B64 }}" ]; then
            echo "UPLOAD_KEYSTORE_B64 이 없다. 스토어용 빌드를 멈춘다."
            echo "사이드로드 키로 서명된 AAB 를 올리면 그 키가 업로드 키로 굳는다."
            exit 1
          fi
      - name: 업로드 키 꺼내기
        run: echo "${{ secrets.UPLOAD_KEYSTORE_B64 }}" | base64 -d > app/upload.jks

      - run: gradle bundleRelease
        env:
          UPLOAD_KEYSTORE: upload.jks
          UPLOAD_STORE_PASS: ${{ secrets.UPLOAD_STORE_PASS }}
          UPLOAD_KEY_PASS: ${{ secrets.UPLOAD_KEY_PASS }}
          UPLOAD_ALIAS: ${{ secrets.UPLOAD_ALIAS }}

      # 어느 키로 서명됐는지 눈으로 본다. 사이드로드 키가 섞여 들어가면
      # 여기서 알아채야 한다 — 올린 뒤에는 못 되돌린다.
      - name: 서명 확인
        run: |
          B=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$B/apksigner" verify --print-certs --verbose \
            app/build/outputs/bundle/release/app-release.aab 2>/dev/null \
            || jarsigner -verify -verbose:summary -certs \
                 app/build/outputs/bundle/release/app-release.aab | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: plus25-aab
          path: app/build/outputs/bundle/release/app-release.aab
